<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple task list that saves tasks in this browser.">
  <title>My Task List</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
      <h1>My task list</h1>
      <p class="intro">Add tasks, remove completed items, and keep your list after refreshing.</p>
    </header>

    <form id="form" class="task-form">
      <label for="text">New task</label>
      <div class="form-row">
        <input id="text" name="task" type="text" maxlength="200"
               placeholder="e.g. Revise JavaScript arrays" autocomplete="off">
        <button type="submit">Add task</button>
      </div>
    </form>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <section aria-labelledby="tasks-heading">
      <div class="section-heading">
        <h2 id="tasks-heading">Your tasks</h2>
        <span id="task-count" class="count">0 tasks</span>
      </div>
      <ul id="list" class="task-list"></ul>
      <p id="empty-state" class="empty-state">No tasks yet. Add your first task above.</p>
    </section>
    <footer>Tasks are saved in this browser on this device.</footer>
  </main>
</body>
</html>
